spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  ai:
    model:
      # Proveedor activo: ollama o anthropic
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          # Necesita un modelo con visión para analizar fotogramas
          model: qwen2.5vl
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
