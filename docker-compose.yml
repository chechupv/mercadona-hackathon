# Arranca el backend y el frontend:   docker compose up --build
# Pararlo:                            docker compose down
# Borrar también la base de datos:    docker compose down -v
#
# La visión (vision/) se ejecuta fuera de Docker, en tu ordenador: Docker en
# Windows no puede usar la webcam ni abrir ventanas. Ver README.md.

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Deja abrir la consola H2 (http://localhost:8080/h2-console) desde tu navegador
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    volumes:
      - backend-data:/app/data   # la base de datos sobrevive a docker compose down
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      # Tiene que ser el 5173: es el origen que permite el CORS del backend
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
