# Arranca todo (backend, visión y frontend):   docker compose up --build
# Pararlo:                                     docker compose down
# Borrar también la base de datos:             docker compose down -v
#
# Después abre http://localhost:5173 y sube un vídeo desde "Visualización de sistema".

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Deja abrir la consola H2 (http://localhost:8080/h2-console) desde tu navegador
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    volumes:
      - backend-data:/app/data   # la base de datos sobrevive a docker compose down
    restart: unless-stopped

  vision:
    # Recibe los vídeos que se suben desde la web y envía los eventos al backend.
    # La primera vez tarda en construirse: descarga PyTorch y los modelos de YOLO.
    build: ./vision
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080   # dentro de Docker el backend se llama "backend"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Direcciones vistas desde el navegador (tu ordenador), no desde dentro de Docker
        VITE_API_URL: http://localhost:8080
        VITE_VISION_URL: http://localhost:8000
    ports:
      # Tiene que ser el 5173: es el origen que permiten el backend y la visión (CORS)
      - "5173:80"
    depends_on:
      - backend
      - vision
    restart: unless-stopped

volumes:
  backend-data:
